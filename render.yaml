services:
  - type: web
    name: freshmart
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: >-
      npm --prefix client ci &&
      npm --prefix client run build &&
      npm --prefix server ci
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      # Set these in the Render dashboard after the first deploy:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
