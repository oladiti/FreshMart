version: 2
updates:
  # Root workspace (Playwright, test tooling).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Backend (Express, Mongoose, Stripe, auth).
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend (React, Vite, Tailwind).
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      client-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep GitHub Actions versions patched.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
